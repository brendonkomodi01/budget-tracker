<div class="container mt-4">
  <h2>Expense list</h2>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>Amount</th>
      <th>Date</th>
      <th>Category</th>
      <th>Description</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let expense of expenses">
      <td>{{ expense.amount }}</td>
      <td>{{ expense.expenseDate | date:'yyyy-MM-dd' }}</td>
      <td>{{ expense.categoryName }}</td>
      <td>{{ expense.description }}</td>
    </tr>
    </tbody>
  </table>
</div>
